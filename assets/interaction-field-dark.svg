    <text x="59" y="163" class="sans" font-size="70" font-weight="700" letter-spacing="4" fill="#f1f1ec">李述博</text>
    <text x="64" y="197" class="mono" font-size="14" font-weight="600" letter-spacing="4.2" fill="#8d9397">SOBERT LI</text>
    <text x="64" y="246" class="sans" font-size="18" font-weight="400" letter-spacing="1.2" fill="#f1f1ec">探索人与 AI 的交互方式</text>
    <path d="M64 283H327" stroke="#4c5256" stroke-width="1"/>
    <path d="M64 283H116" stroke="#f1f1ec" stroke-width="2"/>
    <rect x="337" y="279" width="8" height="8" fill="#ff6422"/>
  </g>

  <g>
    <path d="M500 170H1160" stroke="#4c5256" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.7"/>
    <text x="542" y="91" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8d9397">HUMAN / CONTINUOUS</text>
    <path d="M542 102H574" stroke="#e5e7e3" stroke-width="1.5"/>

    <path d="M500 170
             C548 170 552 112 600 116
             C650 120 638 226 696 218
             C747 211 735 139 780 142
