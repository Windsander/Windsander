<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Sobert Li — Exploring Human–AI Interaction">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#34393d" stroke-width="0.7"/>
    </pattern>
    <clipPath id="fieldClip">
      <polygon points="460,0 1200,0 1200,340 640,340"/>
    </clipPath>
    <clipPath id="ghostClip">
      <rect x="500" y="56" width="650" height="238"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="#111315"/>
  <polygon points="492,0 1200,0 1200,340 654,340" fill="#191c1f"/>
  <g clip-path="url(#fieldClip)" opacity="0.52">
    <rect x="450" width="750" height="340" fill="url(#grid)"/>
  </g>

  <path d="M492 0L654 340" stroke="#4c5256" stroke-width="1" opacity="0.55"/>
  <path d="M507 0L669 340" stroke="#ff6422" stroke-width="2" opacity="0.85"/>

  <g clip-path="url(#ghostClip)" opacity="0.20">
    <text x="642" y="281" class="sans" font-size="176" font-weight="800" letter-spacing="-12" fill="none" stroke="#62696e" stroke-width="1.2">H/AI</text>
  </g>

  <g>
    <rect x="64" y="43" width="7" height="7" fill="#ff6422"/>
    <text x="83" y="51" class="mono" font-size="11" letter-spacing="2.4" fill="#8d9397">HUMAN–AI INTERACTION</text>
    <path d="M319 47H386" stroke="#4c5256" stroke-width="1"/>
    <path d="M394 47H409" stroke="#ff6422" stroke-width="2"/>
  </g>

  <g>
