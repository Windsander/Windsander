    <path d="M1160 170H1104V119H1026V217H946V143H884V170H838"
          fill="none" stroke="#858d92" stroke-width="1.7" stroke-linejoin="miter"/>

    <g fill="#111315" stroke="#858d92" stroke-width="1.4">
      <rect x="1099" y="165" width="10" height="10"/>
      <rect x="1099" y="114" width="10" height="10"/>
      <rect x="1021" y="114" width="10" height="10"/>
      <rect x="1021" y="212" width="10" height="10"/>
      <rect x="941" y="212" width="10" height="10"/>
      <rect x="941" y="138" width="10" height="10"/>
      <rect x="879" y="138" width="10" height="10"/>
      <rect x="879" y="165" width="10" height="10"/>
    </g>

    <path d="M818 170H858M838 150V190" stroke="#ff6422" stroke-width="1" opacity="0.8"/>
    <circle cx="838" cy="170" r="18" fill="none" stroke="#ff6422" stroke-width="1" opacity="0.65"/>
    <circle cx="838" cy="170" r="6.5" fill="#ff6422"/>
    <path d="M846 162L864 144H913" fill="none" stroke="#ff6422" stroke-width="1"/>
    <text x="869" y="134" class="mono" font-size="9.5" letter-spacing="1.3" fill="#ff6422">INTERACTION</text>

    <text x="1005" y="259" class="mono" font-size="9.5" letter-spacing="1.5" fill="#8d9397">AI / DISCRETE</text>
    <path d="M1094 255H1126" stroke="#858d92" stroke-width="1.5"/>
  </g>

  <g>
    <path d="M1000 39H1138" stroke="#4c5256" stroke-width="1"/>
    <path d="M1000 45H1076" stroke="#4c5256" stroke-width="1"/>
    <polygon points="1093,33 1104,33 1096,51 1085,51" fill="#ff6422"/>
    <polygon points="1112,33 1123,33 1115,51 1104,51" fill="#ff6422" opacity="0.65"/>
    <polygon points="1131,33 1142,33 1134,51 1123,51" fill="#ff6422" opacity="0.35"/>
  </g>

  <g class="mono" font-size="9" fill="#8d9397" letter-spacing="1.4">
    <text x="1138" y="298" text-anchor="end">INTERACTION FIELD</text>
    <text x="1138" y="314" text-anchor="end" opacity="0.65">SIGNAL / RESPONSE / COMMON GROUND</text>
  </g>
  <path d="M1025 282H1138" stroke="#4c5256" stroke-width="1"/>
  <rect x="1152" y="282" width="5" height="32" fill="#ff6422"/>
